[tool.poetry]
name = "dummy_django_blog"
version = "0.1.0"
description = "dummy django recap to publish on render"
authors = ["memphis-tools <rn@github.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">3.13,<3.16"
django = ">5.1.9"
gunicorn = ">26.0.0"
pillow = ">12.0.0"
django-bootstrap-icons = ">0.8.0"
pytest = ">8.2.2"
django-pytest = ">0.1.0"
coverage = ">7.16.0"
pylint = ">4.1.0"
python-dotenv = ">1.2.0"
pytest-django = ">4.12.0"
flake8-html = ">0.4.2"
coveralls = ">3.3.1"
pytest-mock = ">3.14.0"
dj-database-url = ">2.1.0"
whitenoise = {extras = ["brotli"], version = "^6.12.0"}
psycopg = ">3.2.1"
django-storages = {extras = ["boto3"], version = "^1.14.6"}
zipp = ">3.20.0"
pip = ">25.2"
logtail-python = ">0.5.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
