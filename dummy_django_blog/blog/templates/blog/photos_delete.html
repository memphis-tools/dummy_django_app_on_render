{% extends 'base.html' %}
{% load bootstrap_icons %}
{% block title %}DELETE PHOTO PAGE{% endblock title %}
{% block content %}
<div class="container-fluid action-page d-flex flex-column align-items-center">
    <i class="feed-smileys fa-solid fa-camera-retro"></i>
    <h2>CONFIRMER SUPPRESSION PHOTO : {{ photo.title }}</h2>
    <div class="action-encart" data-encart="photo_delete">
        <span class="encart-icon"><i class="fa-solid fa-trash"></i></span>
        <p class="encart-text"></p>
    </div>
    <div class="action-card d-flex flex-column align-items-center">
        <img class="photo-delete-preview" src="{{ photo.image.url }}" alt="a dummy photo">
        <form class="form" action="" method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary">CONFIRMER SUPPRESSION</button>
        </form>
        <div class="action-actions">
            <a class="btn btn-primary" href="{% url 'feed' %}">RETOUR ACCUEIL</a>
        </div>
    </div>
</div>
{% endblock content %}
