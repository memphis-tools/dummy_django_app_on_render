{% extends 'base.html' %}
{% load bootstrap_icons %}
{% block title %}CONTACT PAGE{% endblock title %}
{% block content %}
<div class="container-fluid action-page d-flex flex-column align-items-center">
    <i class="feed-smileys fa-solid fa-envelope"></i>
    <h2>CONTACTER UN ADMIN</h2>
    <div class="action-encart" data-encart="contact_admin">
        <span class="encart-icon"><i class="fa-solid fa-envelope"></i></span>
        <p class="encart-text"></p>
    </div>
    <div class="action-card">
        <form class="form d-flex flex-column" action="" method="post">
            {% csrf_token %}
            <label for="username">
                {{ form.username.label }}
            </label>
            <input type="text" id="username" name="username">
            <label for="email">
                {{ form.email.label }}
            </label>
            <input type="email" id="email" name="email">
            <label for="message">
                {{ form.message.label }}
            </label>
            <textarea type="text" id="message" name="message" rows="5"></textarea>
            <div class="button_container d-flex justify-content-start">
                <button type="submit" class="btn btn-primary">ENVOYER MAIL</button>
            </div>
        </form>
        <div class="action-actions">
            <a class="btn btn-primary" href="{% url 'feed' %}">RETOUR ACCUEIL</a>
        </div>
    </div>
</div>
{% endblock content %}
