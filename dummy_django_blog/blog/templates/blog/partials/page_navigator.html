<div class="pagination-dossier">
    <span class="pagination-dossier-status">DOSSIER : PAGE <strong>{{ page_obj.number }}</strong> SUR <strong>{{ page_obj.paginator.num_pages }}</strong></span>
    <div class="pagination-dossier-links">
        {% if page_obj.has_previous %}
            <a href="?page=1">PREMIÈRES</a>
            <a href="?page={{ page_obj.previous_page_number }}">PRÉCÉDENTES</a>
        {% else %}
            <a class="disabled-link">PREMIÈRES</a>
            <a class="disabled-link">PRÉCÉDENTES</a>
        {% endif %}
        {% if page_obj.has_next %}
            <a href="?page={{ page_obj.next_page_number }}">PROCHAINES</a>
            <a href="?page={{ page_obj.paginator.num_pages }}">DERNIÈRES</a>
        {% else %}
            <a class="disabled-link">PROCHAINES</a>
            <a class="disabled-link">DERNIÈRES</a>
        {% endif %}
    </div>
</div>
