{% extends 'base.html' %}
{% load bootstrap_icons %}
{% block title %}PHOTO ADD PAGE{% endblock title %}
{% block content %}
<div class="container-fluid action-page d-flex flex-column align-items-center">
    <i class="feed-smileys fa-solid fa-camera-retro"></i>
    <h2>AJOUTER UNE PHOTO</h2>
    <div class="action-encart" data-encart="photo_add">
        <span class="encart-icon"><i class="fa-solid fa-camera-retro"></i></span>
        <p class="encart-text"></p>
    </div>
    <div class="action-card w-50">
        <form class="form d-flex flex-column w-100" action="" method="post" enctype="multipart/form-data">
          {% csrf_token %}
          <label for="title_photo">{{ form.title_photo.label }}</label>
          <input type="text" id="title_photo" name="title_photo" required>
          <label for="caption">{{ form.caption.label }}</label>
          <textarea id="caption" name="caption" rows="2" required></textarea>
          <input type="file" name="image" accept="image/*" id="id_image" required>
          <input type="hidden" name="edit_photo" value="True">
          <div class="button_container d-flex justify-content-start">
            <button type="submit" class="btn btn-primary">PUBLIER</button>
          </div>
        </form>
        <div class="action-actions">
          <a class="btn btn-primary" href="{% url 'feed' %}">RETOUR ACCUEIL</a>
        </div>
    </div>
</div>
{% endblock content %}
