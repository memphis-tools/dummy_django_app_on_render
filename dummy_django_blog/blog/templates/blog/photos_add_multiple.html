{% extends 'base.html' %}
{% load bootstrap_icons %}
{% block title %}PHOTO ADD PAGE{% endblock title %}
{% block content %}
<div class="container-fluid action-page d-flex flex-column align-items-center">
    <i class="feed-smileys fa-solid fa-camera-retro"></i>
    <h2>AJOUTER PLUSIEURS PHOTOS</h2>
    <div class="action-encart" data-encart="photo_add_multiple">
        <span class="encart-icon"><i class="fa-solid fa-clone"></i></span>
        <p class="encart-text"></p>
    </div>
    <div class="action-card w-50">
        <form class="form d-flex flex-column w-100" action="" method="post" enctype="multipart/form-data">
          {{ formset.management_form }}
          {% csrf_token %}
          {% for form in formset %}
              <label for="{{ form.prefix }}-title_photo">{{ form.title_photo.label }}</label>
              <input type="text" id="{{ form.prefix }}-title_photo" name="{{ form.prefix }}-title_photo" required>
              <label for="{{ form.prefix }}-caption">{{ form.caption.label }}</label>
              <textarea id="{{ form.prefix }}-caption" name="{{ form.prefix }}-caption" rows="2" required></textarea>
              <input type="file" name="{{ form.prefix }}-image" accept="image/*" id="{{ form.prefix }}-id_image" required>
              <input type="hidden" name="{{ form.prefix }}-edit_photo" value="True">
          {% endfor %}
          <div class="button_container d-flex justify-content-start">
              <button type="submit" class="btn btn-primary">TELEVERSER</button>
          </div>
        </form>
        <div class="action-actions">
          <a class="btn btn-primary" href="{% url 'feed' %}">RETOUR ACCUEIL</a>
        </div>
    </div>
</div>
{% endblock content %}
