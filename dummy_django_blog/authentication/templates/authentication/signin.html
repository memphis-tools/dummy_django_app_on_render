{% extends 'base.html' %}
{% load bootstrap_icons %}
{% block title %}SIGNIN PAGE{% endblock title %}
{% block content %}
<div class="container-fluid action-page d-flex flex-column align-items-center">
    <i class="feed-smileys fa-solid fa-user-secret"></i>
    <h2>INSCRIPTION</h2>
    <div class="action-encart" data-encart="signin">
        <span class="encart-icon"><i class="fa-solid fa-user-secret"></i></span>
        <p class="encart-text"></p>
    </div>
    <div class="action-card">
        <form class="form d-flex flex-column" action="" method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">S'INSCRIRE</button>
        </form>
        <div class="action-actions">
            <a class="btn btn-primary" href="{% url 'password_reset' %}">MOT DE PASSE OUBLIE ?</a>
            <a class="btn btn-primary" href="{% url 'home' %}">RETOUR ACCUEIL</a>
        </div>
    </div>
</div>
{% endblock content %}
