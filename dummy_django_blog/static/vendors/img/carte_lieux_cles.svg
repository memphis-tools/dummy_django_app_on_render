<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1100" width="1500" height="1100">
  <title>Croquis des enquêtes — le commissariat au centre, les domiciles de l'équipe et les lieux de meurtre reliés par des allers-retours</title>
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.45  0 0 0 0 0.32  0 0 0 0.35 0"/>
      <feComposite in2="SourceGraphic" operator="in" result="top"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="top"/></feMerge>
    </filter>
    <pattern id="grid" width="75" height="75" patternUnits="userSpaceOnUse">
      <path d="M 75 0 L 0 0 0 75" fill="none" stroke="#5a4632" stroke-width="1" opacity="0.35"/>
    </pattern>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a2b2b"/>
    </marker>
    <marker id="arrow-sepia" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b5335"/>
    </marker>
  </defs>

  <!-- fond parchemin -->
  <rect width="1500" height="1100" fill="#f0e6cf"/>
  <rect width="1500" height="1100" fill="url(#grid)" filter="url(#paper)"/>

  <!-- canal de la Deûle, trait unique discret pour situer Lille -->
  <g stroke="#5f7d8c" stroke-width="9" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M 140 300 C 400 380, 700 430, 1000 400 C 1180 385, 1330 420, 1440 470"/>
  </g>

  <!-- ============================================================
       LIAISONS DOMICILES -> COMMISSARIAT (fil d'enquête rouge pointillé)
       lecture claire : une ligne par personnage, arrivée sur le badge
       ============================================================ -->
  <g stroke="#8a2b2b" stroke-width="5" fill="none" opacity="0.9" stroke-dasharray="14 12" stroke-linecap="round" marker-end="url(#arrow-red)">
    <!-- Swan Laurence (nord-ouest) -> commissariat -->
    <path d="M 420 290 L 690 500"/>
    <!-- Alice Avril (nord-est) -> commissariat -->
    <path d="M 1080 290 L 810 500"/>
    <!-- Marlène Leroy (sud) -> commissariat -->
    <path d="M 750 860 L 750 600"/>
  </g>

  <!-- ============================================================
       ALLERS-RETOURS COMMISSARIAT <-> LIEUX DE MEURTRE
       double-sens : deux tirets paralleles, fleches aux deux bouts
       ============================================================ -->
  <g stroke="#6b5335" stroke-width="4.5" fill="none" opacity="0.85" stroke-dasharray="20 10" stroke-linecap="round">
    <!-- commissariat -> château de Marlène (ouest) -->
    <path d="M 640 560 C 520 580, 420 620, 320 680" marker-end="url(#arrow-sepia)"/>
    <path d="M 350 640 C 450 590, 550 560, 660 545" marker-end="url(#arrow-sepia)"/>
    <!-- commissariat -> villa du lac (est) -->
    <path d="M 860 560 C 980 580, 1080 620, 1180 680" marker-end="url(#arrow-sepia)"/>
    <path d="M 1150 640 C 1050 590, 950 560, 840 545" marker-end="url(#arrow-sepia)"/>
    <!-- commissariat -> plage de Malo-les-Bains (sud-est) -->
    <path d="M 830 610 C 930 700, 1010 790, 1060 880" marker-end="url(#arrow-sepia)"/>
    <path d="M 1010 900 C 960 810, 900 720, 810 630" marker-end="url(#arrow-sepia)"/>
  </g>

  <!-- ============================================================
       LE COMMISSARIAT : pièce centrale, badge étoile
       ============================================================ -->
  <g transform="translate(750,550)">
    <path d="M 0 -72 L 21 -23 L 74 -23 L 31 11 L 48 61 L 0 31 L -48 61 L -31 11 L -74 -23 L -21 -23 Z"
          fill="#8a2b2b" stroke="#3a2c22" stroke-width="3" opacity="0.92"/>
    <path d="M 0 -58 L 17 -19 L 59 -19 L 25 9 L 38 49 L 0 25 L -38 49 L -25 9 L -59 -19 L -17 -19 Z"
          fill="#f0e6cf" stroke="#3a2c22" stroke-width="2.5"/>
    <rect x="-95" y="34" width="190" height="52" fill="#6b5335" stroke="#3a2c22" stroke-width="3" rx="4"/>
    <line x1="-70" y1="60" x2="70" y2="60" stroke="#f0e6cf" stroke-width="4" stroke-linecap="round"/>
    <text y="112" text-anchor="middle" font-family="serif" font-size="34" font-weight="bold" fill="#3a2c22" letter-spacing="2">COMMISSARIAT</text>
    <text y="146" text-anchor="middle" font-family="'Caveat', cursive" font-size="28" fill="#8a2b2b" font-weight="bold">LILLE — ANNÉES 1950</text>
  </g>

  <!-- ============================================================
       LES 3 DOMICILES : maisons pastillées, reliées au commissariat
       ============================================================ -->
  <!-- Swan Laurence -->
  <g transform="translate(420,290)">
    <circle r="34" fill="#2e4a3f" stroke="#f0e6cf" stroke-width="3"/>
    <path d="M -16 8 L -16 -8 L 0 -22 L 16 -8 L 16 8 Z" fill="#f0e6cf"/>
    <text y="-46" text-anchor="middle" font-family="serif" font-size="26" font-weight="bold" fill="#3a2c22">DOMICILE SWAN LAURENCE</text>
    <text y="66" text-anchor="middle" font-family="'Caveat', cursive" font-size="24" fill="#8a2b2b">commissaire divisionnaire</text>
  </g>
  <!-- Alice Avril -->
  <g transform="translate(1080,290)">
    <circle r="34" fill="#2e4a3f" stroke="#f0e6cf" stroke-width="3"/>
    <path d="M -16 8 L -16 -8 L 0 -22 L 16 -8 L 16 8 Z" fill="#f0e6cf"/>
    <text y="-46" text-anchor="middle" font-family="serif" font-size="26" font-weight="bold" fill="#3a2c22">DOMICILE ALICE AVRIL</text>
    <text y="66" text-anchor="middle" font-family="'Caveat', cursive" font-size="24" fill="#8a2b2b">journaliste — La Voix du Nord</text>
  </g>
  <!-- Marlène Leroy -->
  <g transform="translate(750,860)">
    <circle r="34" fill="#2e4a3f" stroke="#f0e6cf" stroke-width="3"/>
    <path d="M -16 8 L -16 -8 L 0 -22 L 16 -8 L 16 8 Z" fill="#f0e6cf"/>
    <text y="-46" text-anchor="middle" font-family="serif" font-size="26" font-weight="bold" fill="#3a2c22">DOMICILE MARLÈNE LEROY</text>
    <text y="66" text-anchor="middle" font-family="'Caveat', cursive" font-size="24" fill="#8a2b2b">secrétaire du commissariat</text>
  </g>

  <!-- ============================================================
       LIEUX DE MEURTRE : cibles rouges numérotées
       ============================================================ -->
  <g font-family="serif">
    <!-- 1 château de Marlène -->
    <g transform="translate(320,680)">
      <circle r="36" fill="#a4243b" opacity="0.9"/>
      <circle r="36" fill="none" stroke="#f0e6cf" stroke-width="3"/>
      <text y="12" text-anchor="middle" font-size="30" font-weight="bold" fill="#f0e6cf">1</text>
      <text y="-52" text-anchor="middle" font-size="26" font-weight="bold" fill="#3a2c22">VILLA DES ROSEAUX</text>
      <text y="66" text-anchor="middle" font-family="'Caveat', cursive" font-size="24" fill="#8a2b2b">lieu de meurtre</text>
    </g>
    <!-- 2 villa du lac -->
    <g transform="translate(1180,680)">
      <circle r="36" fill="#a4243b" opacity="0.9"/>
      <circle r="36" fill="none" stroke="#f0e6cf" stroke-width="3"/>
      <text y="12" text-anchor="middle" font-size="30" font-weight="bold" fill="#f0e6cf">2</text>
      <text y="-52" text-anchor="middle" font-size="26" font-weight="bold" fill="#3a2c22">VILLA DU LAC</text>
      <text y="66" text-anchor="middle" font-family="'Caveat', cursive" font-size="24" fill="#8a2b2b">lieu de meurtre</text>
    </g>
    <!-- 3 plage de Malo -->
    <g transform="translate(1060,880)">
      <circle r="36" fill="#a4243b" opacity="0.9"/>
      <circle r="36" fill="none" stroke="#f0e6cf" stroke-width="3"/>
      <text y="12" text-anchor="middle" font-size="30" font-weight="bold" fill="#f0e6cf">3</text>
      <text y="-52" text-anchor="middle" font-size="26" font-weight="bold" fill="#3a2c22">MALO-LES-BAINS</text>
      <text y="66" text-anchor="middle" font-family="'Caveat', cursive" font-size="24" fill="#8a2b2b">lieu de meurtre</text>
    </g>
  </g>

  <!-- annotations à la craie -->
  <g font-family="'Caveat', cursive" fill="#3a2c22" opacity="0.9">
    <text x="200" y="180" font-size="34" transform="rotate(-3 200 180)">indices au bureau...</text>
    <text x="1090" y="180" font-size="34" transform="rotate(2 1090 180)">...sur place à la loupe !</text>
    <text x="240" y="990" font-size="30" transform="rotate(-2 240 990)">chaque enquête : départ bureau, aller-retour sur les lieux</text>
  </g>
  <g opacity="0.75">
    <path d="M 1290 980 C 1330 940, 1350 920, 1360 900" stroke="#3a2c22" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#arrow-sepia)"/>
    <text x="1150" y="1010" font-family="'Caveat', cursive" font-size="30" fill="#3a2c22">la vérité sort de la Deûle</text>
  </g>

  <!-- tampon d'époque -->
  <g transform="translate(1340,160) rotate(-8)" opacity="0.8">
    <rect x="-90" y="-38" width="180" height="76" fill="none" stroke="#8a2b2b" stroke-width="5" rx="8"/>
    <text text-anchor="middle" font-family="serif" font-size="22" font-weight="bold" fill="#8a2b2b">CABINE DE</text>
    <text y="28" text-anchor="middle" font-family="serif" font-size="22" font-weight="bold" fill="#8a2b2b">POLICE</text>
  </g>

  <!-- boussole -->
  <g transform="translate(150,920)" opacity="0.85">
    <circle r="56" fill="none" stroke="#3a2c22" stroke-width="4"/>
    <path d="M 0 -40 L 10 0 L 0 40 L -10 0 Z" fill="#8a2b2b"/>
    <text y="-66" text-anchor="middle" font-family="serif" font-size="24" font-weight="bold" fill="#3a2c22">N</text>
  </g>
</svg>
