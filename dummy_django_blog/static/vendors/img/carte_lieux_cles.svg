<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1100" width="1500" height="1100">
  <title>Pseudo-carte de l'agglomération — commissariat au centre, tous les lieux reliés, libellés écartés</title>
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.75  0 0 0 0 0.62  0 0 0 0.18 0"/>
      <feComposite in2="SourceGraphic" operator="in" result="top"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="top"/></feMerge>
    </filter>
    <g id="pin"><path d="M 0 0 C -10 -8, -18 -16, -18 -26 A 18 18 0 1 1 18 -26 C 18 -16, 10 -8, 0 0 Z"/></g>
    <!-- icone pistolet annees 50 (lieu de crime) -->
    <g id="icon-gun">
      <path d="M -14 -10 L 12 -10 L 12 -4 L 4 -4 L 2 2 L -4 2 L -6 -4 L -14 -4 Z" fill="none" stroke-width="2.5"/>
      <path d="M -10 -4 L -8 6" fill="none" stroke-width="2.5"/>
    </g>
    <!-- icone couteau ensanglante (lieu de crime) -->
    <g id="icon-knife">
      <path d="M -12 4 L 6 -14 L 10 -10 L -8 8 Z" fill="none" stroke-width="2.5"/>
      <path d="M -12 4 L -18 10 M -12 4 L -16 0" fill="none" stroke-width="2.5"/>
      <circle cx="8" cy="-12" r="3"/>
    </g>
    <marker id="ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97a8a"/>
    </marker>
    <marker id="ah-sepia" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0c9a2"/>
    </marker>
  </defs>

  <rect width="1500" height="1100" fill="#221c1c"/>
  <rect width="1500" height="1100" filter="url(#paper)"/>

  <!-- ============ LA VILLE (structure simple et aérée) ============ -->
  <g stroke="#a89878" stroke-width="6" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M 560 380 L 940 380 L 1000 470 L 1000 650 L 940 740 L 560 740 L 500 650 L 500 470 Z"/>
    <path d="M 300 330 C 430 320, 520 350, 560 380 M 940 380 C 1030 340, 1120 330, 1220 350"/>
    <path d="M 560 740 C 470 790, 390 830, 300 850 M 940 740 C 1030 790, 1120 830, 1220 850"/>
    <path d="M 750 380 L 750 150 M 750 740 L 750 860"/>
  </g>
  <g stroke="#b9a98c" stroke-width="2" fill="none" opacity="0.45" stroke-linecap="round">
    <path d="M 750 380 L 750 740 M 500 560 L 1000 560"/>
  </g>
  <g stroke="#8fb6c9" stroke-width="10" fill="none" opacity="0.45" stroke-linecap="round">
    <path d="M 140 300 C 400 380, 700 430, 1000 400 C 1180 385, 1330 420, 1440 470"/>
    <path d="M 140 300 C 200 420, 240 560, 260 720"/>
  </g>
  <g stroke="#c9b48f" stroke-width="3" fill="none" opacity="0.5">
    <path d="M 950 740 L 1150 850 L 1400 940 M 960 720 L 1160 830 L 1400 920"/>
  </g>
  <!-- communes : rangées de toits simples -->
  <g fill="#d9c9a8" opacity="0.4">
    <rect x="150" y="400" width="18" height="11"/><rect x="175" y="400" width="18" height="11"/><rect x="200" y="400" width="18" height="11"/>
    <rect x="150" y="425" width="18" height="11"/><rect x="175" y="425" width="18" height="11"/><rect x="200" y="425" width="18" height="11"/>
    <rect x="1180" y="180" width="18" height="11"/><rect x="1205" y="180" width="18" height="11"/><rect x="1230" y="180" width="18" height="11"/>
    <rect x="1180" y="205" width="18" height="11"/><rect x="1205" y="205" width="18" height="11"/><rect x="1230" y="205" width="18" height="11"/>
    <rect x="1210" y="510" width="18" height="11"/><rect x="1235" y="510" width="18" height="11"/><rect x="1260" y="510" width="18" height="11"/>
    <rect x="170" y="600" width="18" height="11"/><rect x="195" y="600" width="18" height="11"/><rect x="220" y="600" width="18" height="11"/>
  </g>
  <!-- parcs -->
  <g fill="none" stroke="#a3bd7e" stroke-width="3" opacity="0.6" stroke-linecap="round">
    <path d="M 505 690 C 530 655, 585 650, 615 680 C 585 710, 530 712, 505 690 Z"/>
    <path d="M 1110 700 C 1130 675, 1170 678, 1185 700 C 1165 722, 1125 720, 1110 700 Z"/>
  </g>
  <g fill="#a3bd7e" opacity="0.5">
    <circle cx="530" cy="678" r="7"/><circle cx="560" cy="665" r="8"/><circle cx="590" cy="680" r="7"/>
    <circle cx="1130" cy="695" r="6"/><circle cx="1155" cy="705" r="7"/>
  </g>

  <!-- ============ TRACES : tous les lieux relies au COMMISSAAT ============ -->
  <g stroke="#e0c9a2" stroke-width="4" fill="none" opacity="0.7" stroke-dasharray="16 10" stroke-linecap="round">
    <path d="M 690 560 C 640 640, 560 660, 350 690" marker-end="url(#ah-sepia)"/><!-- → Villa Cavrois -->
    <path d="M 810 620 C 880 700, 1000 800, 1090 870" marker-end="url(#ah-sepia)"/><!-- → Malo -->
    <path d="M 750 540 C 700 480, 660 460, 620 440" marker-end="url(#ah-sepia)"/><!-- → Beffroi -->
    <path d="M 790 545 C 830 500, 860 470, 880 445" marker-end="url(#ah-sepia)"/><!-- → Vieux-Lille -->
    <path d="M 730 600 C 680 640, 645 660, 615 660" marker-end="url(#ah-sepia)"/><!-- → Gare -->
    <path d="M 810 600 C 850 615, 880 620, 900 625" marker-end="url(#ah-sepia)"/><!-- → Opéra -->
    <path d="M 750 640 L 750 720" marker-end="url(#ah-sepia)"/><!-- → Rue Nationale -->
    <path d="M 830 660 C 950 750, 1150 820, 1270 850" marker-end="url(#ah-sepia)"/><!-- → Kursaal -->
    <path d="M 870 600 C 1000 640, 1180 655, 1290 665" marker-end="url(#ah-sepia)"/><!-- → Tilques -->
    <path d="M 640 520 C 520 490, 350 460, 210 445" marker-end="url(#ah-sepia)"/><!-- → Wambrechies -->
    <path d="M 690 500 C 620 380, 660 260, 700 215" marker-end="url(#ah-sepia)"/><!-- → Steene -->
    <path d="M 700 620 C 550 700, 400 740, 250 765" marker-end="url(#ah-sepia)"/><!-- → Béthune -->
    <path d="M 720 560 C 690 545, 670 528, 650 510" marker-end="url(#ah-sepia)"/><!-- → Voix du Nord -->
    <path d="M 700 590 C 660 600, 640 690, 830 705" marker-end="url(#ah-sepia)"/><!-- → Styles -->
  </g>
  <!-- liaisons personnage vers commissariat (Alice rouge, Laurence rouge plein, Marlène sépia) -->
  <g stroke="#d97a8a" stroke-width="5" fill="none" opacity="0.85" stroke-linecap="round">
    <path d="M 1080 290 C 960 360, 850 470, 790 540" marker-end="url(#ah-red)"/><!-- Alice chez elle → commissariat -->
    <path d="M 420 290 C 540 360, 640 450, 700 520" marker-end="url(#ah-red)"/><!-- Laurence chez lui → commissariat -->
  </g>
  <g stroke="#e0c9a2" stroke-width="4.5" fill="none" opacity="0.75" stroke-dasharray="4 9" stroke-linecap="round">
    <path d="M 750 860 C 755 790, 752 720, 750 650" marker-end="url(#ah-sepia)"/><!-- Marlène → commissariat -->
  </g>

  <!-- ============ COMMISSARIAT : centre névralgique ============ -->
  <g transform="translate(750,590)">
    <use href="#pin" transform="scale(2.6)" fill="#9fc4f0" stroke="#221c1c" stroke-width="2.5"/>
    <text y="-48" text-anchor="middle" font-family="serif" font-size="34" font-weight="bold" fill="#221c1c">C</text>
    <text y="108" text-anchor="middle" font-family="serif" font-size="34" font-weight="bold" fill="#ea9ef0" letter-spacing="2">COMMISSARIAT</text>
    <text y="140" text-anchor="middle" font-family="'Caveat', cursive" font-size="27" fill="#f8ede3">le QG des enquêtes</text>
  </g>

  <!-- ============ DOMICILES DES HEROS (sans annotation vehicule) ============ -->
  <!-- Laurence : nord-ouest -->
  <g transform="translate(420,290)">
    <use href="#pin" transform="scale(1.4)" fill="#d97a8a" stroke="#221c1c" stroke-width="3"/>
    <text y="-56" text-anchor="middle" font-family="serif" font-size="28" font-weight="bold" fill="#ea9ef0">CHEZ LE COMMISSAIRE</text>
    <text y="-28" text-anchor="middle" font-family="serif" font-size="28" font-weight="bold" fill="#ea9ef0">LAURENCE</text>
  </g>
  <!-- Alice : nord-est, coherente avec la liaison qui part vers le commissariat -->
  <g transform="translate(1080,290)">
    <use href="#pin" transform="scale(1.4)" fill="#d97a8a" stroke="#221c1c" stroke-width="3"/>
    <text y="-56" text-anchor="middle" font-family="serif" font-size="28" font-weight="bold" fill="#ea9ef0">CHEZ ALICE AVRIL</text>
  </g>
  <!-- Marlène : sud -->
  <g transform="translate(750,860)">
    <use href="#pin" transform="scale(1.4)" fill="#e0c9a2" stroke="#221c1c" stroke-width="3"/>
    <text y="-56" text-anchor="middle" font-family="serif" font-size="28" font-weight="bold" fill="#ea9ef0">CHEZ MARLÈNE LEROY</text>
  </g>

  <!-- ============ LIEUX (libellles epars, verticaux quand utile) ============ -->
  <!-- 1 Villa Cavrois : crime (couteau) -->
  <g transform="translate(320,690)">
    <use href="#pin" fill="#d97a8a" stroke="#221c1c" stroke-width="3"/>
    <text y="-20" text-anchor="middle" font-family="serif" font-size="24" font-weight="bold" fill="#221c1c">1</text>
    <text x="20" y="52" font-family="serif" font-size="27" font-weight="bold" fill="#ea9ef0" transform="rotate(-22 20 52)">VILLA CAVROIS — CROIX</text>
    <use href="#icon-knife" transform="translate(40,40) scale(1.3)" stroke="#d97a8a"/>
  </g>
  <!-- 2 Malo : crime (pistolet) -->
  <g transform="translate(1120,910)">
    <use href="#pin" fill="#d97a8a" stroke="#221c1c" stroke-width="3"/>
    <text y="-20" text-anchor="middle" font-family="serif" font-size="24" font-weight="bold" fill="#221c1c">2</text>
    <text x="18" y="44" font-family="serif" font-size="27" font-weight="bold" fill="#ea9ef0" transform="rotate(-20 18 44)">MALO-LES-BAINS</text>
    <use href="#icon-gun" transform="translate(42,-40) scale(1.3)" stroke="#d97a8a"/>
  </g>
  <!-- 3 Beffroi / hôtel de ville : nord du centre, libellé vertical -->
  <g transform="translate(600,430)">
    <use href="#pin" fill="#c9b48f" stroke="#221c1c" stroke-width="3"/>
    <text y="-20" text-anchor="middle" font-family="serif" font-size="24" font-weight="bold" fill="#221c1c">3</text>
    <text x="-20" y="-46" font-family="serif" font-size="27" font-weight="bold" fill="#ea9ef0" transform="rotate(-18 -20 -46)">BEFFROI — HÔTEL DE VILLE</text>
  </g>
  <!-- 4 Vieux-Lille : nord-est du centre, libellé vertical -->
  <g transform="translate(890,440)">
    <use href="#pin" fill="#c9b48f" stroke="#221c1c" stroke-width="3"/>
    <text y="-20" text-anchor="middle" font-family="serif" font-size="24" font-weight="bold" fill="#221c1c">4</text>
    <text x="-24" y="-58" font-family="serif" font-size="27" font-weight="bold" fill="#ea9ef0" transform="rotate(-14 -24 -58)">VIEUX-LILLE, RUE DE LA MONNAIE</text>
  </g>
  <!-- 5 Gare : ouest du centre -->
  <g transform="translate(610,660)">
    <use href="#pin" fill="#c9b48f" stroke="#221c1c" stroke-width="3"/>
    <text y="-20" text-anchor="middle" font-family="serif" font-size="24" font-weight="bold" fill="#221c1c">5</text>
    <text x="-40" y="36" font-family="serif" font-size="27" font-weight="bold" fill="#ea9ef0" transform="rotate(-24 -40 36)">GARE LILLE-FLANDRES</text>
  </g>
  <!-- 6 Opéra : est du centre -->
  <g transform="translate(900,620)">
    <use href="#pin" fill="#c9b48f" stroke="#221c1c" stroke-width="3"/>
    <text y="-20" text-anchor="middle" font-family="serif" font-size="24" font-weight="bold" fill="#221c1c">6</text>
    <text x="16" y="-34" font-family="serif" font-size="27" font-weight="bold" fill="#ea9ef0" transform="rotate(-16 16 -34)">OPÉRA DE LILLE</text>
  </g>
  <!-- 7 Rue Nationale : sud du centre -->
  <g transform="translate(750,730)">
    <use href="#pin" fill="#c9b48f" stroke="#221c1c" stroke-width="3"/>
    <text y="-20" text-anchor="middle" font-family="serif" font-size="24" font-weight="bold" fill="#221c1c">7</text>
    <text x="0" y="36" text-anchor="middle" font-family="serif" font-size="27" font-weight="bold" fill="#ea9ef0">RUE NATIONALE</text>
  </g>
  <!-- 8 Kursaal : sud-est cote -->
  <g transform="translate(1290,860)">
    <use href="#pin" fill="#c9b48f" stroke="#221c1c" stroke-width="3"/>
    <text y="-20" text-anchor="middle" font-family="serif" font-size="24" font-weight="bold" fill="#221c1c">8</text>
    <text x="14" y="40" font-family="serif" font-size="27" font-weight="bold" fill="#ea9ef0" transform="rotate(-18 14 40)">LE KURSAAL</text>
  </g>
  <!-- 9 Tilques : est -->
  <g transform="translate(1310,660)">
    <use href="#pin" fill="#c9b48f" stroke="#221c1c" stroke-width="3"/>
    <text y="-20" text-anchor="middle" font-family="serif" font-size="24" font-weight="bold" fill="#221c1c">9</text>
    <text x="-36" y="44" font-family="serif" font-size="27" font-weight="bold" fill="#ea9ef0" transform="rotate(-20 -36 44)">CHÂTEAU D'ÉCOU — TILQUES</text>
  </g>
  <!-- 10 Wambrechies : nord-ouest -->
  <g transform="translate(190,440)">
    <use href="#pin" fill="#c9b48f" stroke="#221c1c" stroke-width="3"/>
    <text y="-20" text-anchor="middle" font-family="serif" font-size="24" font-weight="bold" fill="#221c1c">10</text>
    <text x="18" y="-40" font-family="serif" font-size="27" font-weight="bold" fill="#ea9ef0" transform="rotate(-16 18 -40)">CHÂTEAU DE WAMBRECHIES</text>
  </g>
  <!-- 11 Steene : nord-est -->
  <g transform="translate(1252,200)">
    <use href="#pin" fill="#d97a8a" stroke="#221c1c" stroke-width="3"/>
    <text y="-20" text-anchor="middle" font-family="serif" font-size="24" font-weight="bold" fill="#221c1c">11</text>
    <text x="16" y="46" font-family="serif" font-size="27" font-weight="bold" fill="#ea9ef0" transform="rotate(-18 16 46)">CHÂTEAU DE STEENE — ÉP. 3</text>
  </g>
  <!-- 12 Béthune : sud-ouest -->
  <g transform="translate(232,756)">
    <use href="#pin" fill="#c9b48f" stroke="#221c1c" stroke-width="3"/>
    <text y="-20" text-anchor="middle" font-family="serif" font-size="24" font-weight="bold" fill="#221c1c">12</text>
    <text x="18" y="40" font-family="serif" font-size="27" font-weight="bold" fill="#ea9ef0" transform="rotate(-16 18 40)">BÉTHUNE — GRAND-PLACE — ÉP. 21</text>
  </g>
  <!-- 13 La Voix du Nord : centre-ouest, proche Grand'Place, libellé vertical -->
  <g transform="translate(645,500)">
    <use href="#pin" fill="#8fd0b0" stroke="#221c1c" stroke-width="3"/>
    <text y="-20" text-anchor="middle" font-family="serif" font-size="24" font-weight="bold" fill="#221c1c">13</text>
    <text x="-30" y="-64" font-family="serif" font-size="27" font-weight="bold" fill="#ea9ef0" transform="rotate(-12 -30 -64)">LA VOIX DU NORD — RÉDACTION D'ALICE</text>
  </g>
  <!-- 17 Manoir de Styles : crime (pistolet) -->
  <g transform="translate(855,700)">
    <use href="#pin" fill="#d97a8a" stroke="#221c1c" stroke-width="3"/>
    <text y="-20" text-anchor="middle" font-family="serif" font-size="24" font-weight="bold" fill="#221c1c">17</text>
    <text x="16" y="48" font-family="serif" font-size="27" font-weight="bold" fill="#ea9ef0" transform="rotate(-18 16 48)">MANOIR DE STYLES — ÉP. 15</text>
    <use href="#icon-gun" transform="translate(-45,40) scale(1.2)" stroke="#d97a8a"/>
  </g>
  <!-- 18 Citadelle : ouest, decor emblematique -->
  <g transform="translate(300,470)">
    <use href="#pin" fill="#c9b48f" stroke="#221c1c" stroke-width="3"/>
    <text y="-20" text-anchor="middle" font-family="serif" font-size="24" font-weight="bold" fill="#221c1c">18</text>
    <text x="-24" y="-42" font-family="serif" font-size="27" font-weight="bold" fill="#ea9ef0" transform="rotate(-16 -24 -42)">CITADELLE DE LILLE</text>
  </g>
  <!-- 19 Grand'Place : centre, sous la Voix du Nord -->
  <g transform="translate(680,545)">
    <use href="#pin" fill="#c9b48f" stroke="#221c1c" stroke-width="3"/>
    <text y="-20" text-anchor="middle" font-family="serif" font-size="24" font-weight="bold" fill="#221c1c">19</text>
    <text x="0" y="34" text-anchor="middle" font-family="serif" font-size="27" font-weight="bold" fill="#ea9ef0">GRAND'PLACE</text>
  </g>
</svg>
