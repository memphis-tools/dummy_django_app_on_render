<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1100" width="1500" height="1100">
  <title>Pseudo-carte stylisée des lieux clés des épisodes des Petits Meurtres d'Agatha Christie (saison 2)</title>
  <!-- fond parchemin -->
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.45  0 0 0 0 0.32  0 0 0 0.35 0"/>
      <feComposite in2="SourceGraphic" operator="in" result="top"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="top"/></feMerge>
    </filter>
    <pattern id="grid" width="75" height="75" patternUnits="userSpaceOnUse">
      <path d="M 75 0 L 0 0 0 75" fill="none" stroke="#5a4632" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="1500" height="1100" fill="#f0e6cf"/>
  <rect width="1500" height="1100" fill="url(#grid)" filter="url(#paper)"/>

  <!-- routes principales (encre sépia) -->
  <g stroke="#6b5335" stroke-width="7" fill="none" opacity="0.9" stroke-linecap="round">
    <path d="M 380 240 C 480 300, 560 340, 660 420"/>
    <path d="M 660 420 C 740 470, 800 520, 880 600"/>
    <path d="M 880 600 C 960 660, 1040 720, 1150 780"/>
    <path d="M 660 420 C 620 520, 600 640, 620 760"/>
    <path d="M 620 760 C 640 860, 700 940, 800 1000"/>
    <path d="M 380 240 C 300 320, 260 440, 280 560"/>
    <path d="M 280 560 C 300 680, 360 800, 460 880"/>
    <path d="M 1150 780 C 1250 800, 1330 840, 1390 900"/>
  </g>
  <!-- routes secondaires -->
  <g stroke="#7d6242" stroke-width="3.5" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M 560 340 C 640 300, 740 300, 820 340"/>
    <path d="M 820 340 C 900 380, 980 440, 1040 500"/>
    <path d="M 1040 500 C 1000 600, 980 700, 1000 800"/>
    <path d="M 280 560 C 400 560, 520 580, 620 640"/>
    <path d="M 880 600 C 960 560, 1060 540, 1160 560"/>
    <path d="M 620 760 C 720 720, 820 720, 920 760"/>
  </g>
  <!-- rivière / canal (Lys - Deûle stylisé) -->
  <g stroke="#5f7d8c" stroke-width="10" fill="none" opacity="0.75" stroke-linecap="round">
    <path d="M 180 980 C 320 900, 460 860, 620 820"/>
    <path d="M 620 820 C 760 790, 900 780, 1040 800"/>
    <path d="M 1040 800 C 1180 820, 1300 860, 1400 920"/>
  </g>
  <g stroke="#5f7d8c" stroke-width="10" fill="none" opacity="0.75" stroke-linecap="round">
    <path d="M 300 180 C 420 220, 520 280, 620 360"/>
    <path d="M 620 360 C 700 420, 760 500, 800 580"/>
  </g>

  <!-- foret / parc (Villers) -->
  <g fill="#6d7a4f" opacity="0.55">
    <ellipse cx="500" cy="900" rx="110" ry="70" transform="rotate(-12 500 900)"/>
    <ellipse cx="560" cy="860" rx="70" ry="45" transform="rotate(-8 560 860)"/>
  </g>

  <!-- LIEUX CLES DES EPISODES : pastilles + libellés à la craie -->
  <g class="place" transform="translate(380,240)">
    <circle r="26" fill="#8a2b2b" opacity="0.85"/>
    <circle r="26" fill="none" stroke="#f0e6cf" stroke-width="2.5"/>
    <text y="8" text-anchor="middle" font-family="serif" font-size="22" fill="#f0e6cf" font-weight="bold">1</text>
    <text y="-40" text-anchor="middle" font-family="serif" font-size="26" fill="#3a2c22" font-weight="bold">CHÂTEAU DE MARLÈNE — LILLE</text>
    <text y="48" text-anchor="middle" font-family="serif" font-size="20" fill="#5a4632" font-style="italic">« Toutes griffes dehors », quartier de Wazemmes</text>
  </g>
  <g class="place" transform="translate(660,420)">
    <circle r="26" fill="#8a2b2b" opacity="0.85"/>
    <circle r="26" fill="none" stroke="#f0e6cf" stroke-width="2.5"/>
    <text y="8" text-anchor="middle" font-family="serif" font-size="22" fill="#f0e6cf" font-weight="bold">2</text>
    <text y="-40" text-anchor="middle" font-family="serif" font-size="26" fill="#3a2c22" font-weight="bold">VILLA CAVROIS — CROIX</text>
    <text y="48" text-anchor="middle" font-family="serif" font-size="20" fill="#5a4632" font-style="italic">« Meurtres en solde », « La Mystérieuse Affaire de Styles »</text>
  </g>
  <g class="place" transform="translate(880,600)">
    <circle r="26" fill="#8a2b2b" opacity="0.85"/>
    <circle r="26" fill="none" stroke="#f0e6cf" stroke-width="2.5"/>
    <text y="8" text-anchor="middle" font-family="serif" font-size="22" fill="#f0e6cf" font-weight="bold">3</text>
    <text y="-40" text-anchor="middle" font-family="serif" font-size="26" fill="#3a2c22" font-weight="bold">CHÂTEAU D'ANTOING — BELGIQUE</text>
    <text y="48" text-anchor="middle" font-family="serif" font-size="20" fill="#5a4632" font-style="italic">« L'Étrange Enlèvement du petit Bruno », « Le Cheval pâle »</text>
  </g>
  <g class="place" transform="translate(1150,780)">
    <circle r="26" fill="#8a2b2b" opacity="0.85"/>
    <circle r="26" fill="none" stroke="#f0e6cf" stroke-width="2.5"/>
    <text y="8" text-anchor="middle" font-family="serif" font-size="22" fill="#f0e6cf" font-weight="bold">4</text>
    <text y="-40" text-anchor="middle" font-family="serif" font-size="26" fill="#3a2c22" font-weight="bold">OPÉRA DE LILLE</text>
    <text y="48" text-anchor="middle" font-family="serif" font-size="20" fill="#5a4632" font-style="italic">« Crime de Noël », « Meurtre au champagne »</text>
  </g>
  <g class="place" transform="translate(460,880)">
    <circle r="26" fill="#8a2b2b" opacity="0.85"/>
    <circle r="26" fill="none" stroke="#f0e6cf" stroke-width="2.5"/>
    <text y="8" text-anchor="middle" font-family="serif" font-size="22" fill="#f0e6cf" font-weight="bold">5</text>
    <text y="-40" text-anchor="middle" font-family="serif" font-size="26" fill="#3a2c22" font-weight="bold">LE FORT DE SECLIN</text>
    <text y="48" text-anchor="middle" font-family="serif" font-size="20" fill="#5a4632" font-style="italic">« Meurtre à la kermesse », « Jeux de glaces »</text>
  </g>
  <g class="place" transform="translate(800,1000)">
    <circle r="26" fill="#8a2b2b" opacity="0.85"/>
    <circle r="26" fill="none" stroke="#f0e6cf" stroke-width="2.5"/>
    <text y="8" text-anchor="middle" font-family="serif" font-size="22" fill="#f0e6cf" font-weight="bold">6</text>
    <text y="-40" text-anchor="middle" font-family="serif" font-size="26" fill="#3a2c22" font-weight="bold">CHÂTEAU DE WAMBRECIES</text>
    <text y="48" text-anchor="middle" font-family="serif" font-size="20" fill="#5a4632" font-style="italic">« Témoin muet », « Drame en trois actes »</text>
  </g>
  <g class="place" transform="translate(280,560)">
    <circle r="26" fill="#8a2b2b" opacity="0.85"/>
    <circle r="26" fill="none" stroke="#f0e6cf" stroke-width="2.5"/>
    <text y="8" text-anchor="middle" font-family="serif" font-size="22" fill="#f0e6cf" font-weight="bold">7</text>
    <text y="-40" text-anchor="middle" font-family="serif" font-size="26" fill="#3a2c22" font-weight="bold">LE CRUISING CLUB DE LA BAIE DE SOMME</text>
    <text y="48" text-anchor="middle" font-family="serif" font-size="20" fill="#5a4632" font-style="italic">« Ding Dingue Dong », « Mélodie mortelle »</text>
  </g>
  <g class="place" transform="translate(1040,500)">
    <circle r="26" fill="#8a2b2b" opacity="0.85"/>
    <circle r="26" fill="none" stroke="#f0e6cf" stroke-width="2.5"/>
    <text y="8" text-anchor="middle" font-family="serif" font-size="22" fill="#f0e6cf" font-weight="bold">8</text>
    <text y="-40" text-anchor="middle" font-family="serif" font-size="26" fill="#3a2c22" font-weight="bold">LAMBERSART — L'AVENUE DE L'HIPPODROME</text>
    <text y="48" text-anchor="middle" font-family="serif" font-size="20" fill="#5a4632" font-style="italic">« Le miroir se brisa », « Meurtre au champ de courses »</text>
  </g>
  <g class="place" transform="translate(820,340)">
    <circle r="26" fill="#8a2b2b" opacity="0.85"/>
    <circle r="26" fill="none" stroke="#f0e6cf" stroke-width="2.5"/>
    <text y="8" text-anchor="middle" font-family="serif" font-size="22" fill="#f0e6cf" font-weight="bold">9</text>
    <text y="-40" text-anchor="middle" font-family="serif" font-size="26" fill="#3a2c22" font-weight="bold">LA GARE DE LILLE — LE SILENCE DE LA VOIX 4</text>
    <text y="48" text-anchor="middle" font-family="serif" font-size="20" fill="#5a4632" font-style="italic">« L'Homme au complet marron », « Murder Party »</text>
  </g>
  <g class="place" transform="translate(1390,900)">
    <circle r="26" fill="#8a2b2b" opacity="0.85"/>
    <circle r="26" fill="none" stroke="#f0e6cf" stroke-width="2.5"/>
    <text y="8" text-anchor="middle" font-family="serif" font-size="22" fill="#f0e6cf" font-weight="bold">10</text>
    <text y="-40" text-anchor="middle" font-family="serif" font-size="26" fill="#3a2c22" font-weight="bold">LA PLAGE DU TOUQUET — LE COUNTER</text>
    <text y="48" text-anchor="middle" font-family="serif" font-size="20" fill="#5a4632" font-style="italic">« Un meurtre est-il facile ? », « Le Crime est notre affaire »</text>
  </g>
  <g class="place" transform="translate(620,760)">
    <circle r="26" fill="#8a2b2b" opacity="0.85"/>
    <circle r="26" fill="none" stroke="#f0e6cf" stroke-width="2.5"/>
    <text y="8" text-anchor="middle" font-family="serif" font-size="22" fill="#f0e6cf" font-weight="bold">11</text>
    <text y="-40" text-anchor="middle" font-family="serif" font-size="26" fill="#3a2c22" font-weight="bold">LE CHÂTEAU D'HARCHIES</text>
    <text y="48" text-anchor="middle" font-family="serif" font-size="20" fill="#5a4632" font-style="italic">« La Peau du léopard », « Le Meurtre de Roger Ackroyd »</text>
  </g>
  <g class="place" transform="translate(1160,560)">
    <circle r="26" fill="#8a2b2b" opacity="0.85"/>
    <circle r="26" fill="none" stroke="#f0e6cf" stroke-width="2.5"/>
    <text y="8" text-anchor="middle" font-family="serif" font-size="22" fill="#f0e6cf" font-weight="bold">12</text>
    <text y="-40" text-anchor="middle" font-family="serif" font-size="26" fill="#3a2c22" font-weight="bold">LA PISCINE DE ROUBAIX — LA MONDOVIA</text>
    <text y="48" text-anchor="middle" font-family="serif" font-size="20" fill="#5a4632" font-style="italic">« Drame en trois actes », « Le Meurtre de l'homme maigre »</text>
  </g>

  <!-- boussole -->
  <g transform="translate(1390,170)">
    <circle r="52" fill="none" stroke="#5a4632" stroke-width="3" opacity="0.8"/>
    <circle r="44" fill="none" stroke="#5a4632" stroke-width="1.5" opacity="0.5"/>
    <path d="M 0 -40 L 10 0 L 0 40 L -10 0 Z" fill="#8a2b2b" opacity="0.85"/>
    <text y="-58" text-anchor="middle" font-family="serif" font-size="24" fill="#3a2c22" font-weight="bold">N</text>
  </g>

  <!-- tampon / cartouche -->
  <g transform="translate(90,1000)">
    <rect x="0" y="-36" width="330" height="52" rx="6" fill="#f0e6cf" stroke="#5a4632" stroke-width="2" opacity="0.9" transform="rotate(-2)"/>
    <text x="165" y="0" text-anchor="middle" font-family="serif" font-size="24" fill="#3a2c22" font-weight="bold" transform="rotate(-2)">CROQUIS DU COMMISSAIRE SWAN LAURENCE</text>
  </g>
</svg>
