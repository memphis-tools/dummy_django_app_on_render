databases:
  - name: dummy_django_app_on_render
    user: admin
    plan: free
    region: frankfurt

services:
  - type: web
    name: dummy_django_app_on_render
    plan: free
    region: frankfurt
    runtime: python
    buildCommand: "./docker-compose-deployment.sh cloud"
    startCommand: "./venv/bin/python -m gunicorn -b :8000 dummy_django_blog.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dummy_django_app_on_render
          property: connectionString
      - key: WEB_CONCURRENCY
        value: 2
      - key: PYTHON_VERSION
        value: 3.14.8
      - key: POETRY_VERSION
        value: 2.3.1
      - key: PORT
        value: 8000
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_ADMIN_LOGIN
        value: admin
      - key: DJANGO_ADMIN_PASSWORD
        generateValue: true
      - key: DJANGO_ADMIN_EMAIL
        value: admin@bluelake.fr
      - key: DEBUG
        value: 0
      - key: RUNNING_ENV
        value: cloud
      - key: TIME_ZONE
        value: Europe/Paris
      
