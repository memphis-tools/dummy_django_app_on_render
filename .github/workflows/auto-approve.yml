name: Auto-approve PRs

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    if: >-
      ${{
        contains(github.actor, 'vibe') ||
        startsWith(github.event.pull_request.title, 'docs/')
      }}
    steps:
      - name: Approve pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if gh pr review --approve "$PR_URL" --body "Auto-approbation - PR emise par Vibe ou dont le titre commence par docs/"; then
            echo "PR auto-approuvee"
          else
            echo "::warning::Approbation refusee - verifier le parametre 'Allow GitHub Actions to approve pull requests' (Settings > Actions > General > Workflow permissions)"
          fi
