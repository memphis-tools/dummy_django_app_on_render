services:
  django:
    build:
      context: ./dummy_django_blog
      dockerfile: Dockerfile
    container_name: django
    command:
      sh -c "gunicorn dummy_django_blog.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - static_volume:/home/dummy-operator/web/staticfiles
    expose:
      - 8000
    environment:
      - RUNNING_ENV
      - DEBUG
      - SECRET_KEY
      - ALLOWED_HOSTS
      - EMAIL_HOST
      - EMAIL_PORT
      - EMAIL_USE_TLS
      - DEFAULT_FROM_EMAIL
      - EMAIL_HOST_USER
      - EMAIL_HOST_PASSWORD
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_DEFAULT_REGION
      - SENDGRID_API_KEY

  nginx:
    build: ./nginx
    container_name: nginx
    volumes:
      - static_volume:/home/dummy-operator/web/staticfiles
    ports:
      - 5555:8080
    depends_on:
      - django

volumes:
  static_volume:
